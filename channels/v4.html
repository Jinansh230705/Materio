<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materio Labs - v4</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <style>
        /* Global Color Declarations */
        :root {
            --primary-bg: #ffffff;
            --secondary: #ff8400;
            --dark-bg: #121212;
            --dark-header: #222222;
            --dark-border: #444444;
            --border: #d1d1d1;
            --navbar: rgb(229, 229, 229);
            --navbar-grey: rgb(203, 203, 203);
            --dark-nav: rgb(210, 210, 210);
            --card: #f8f8f8;
            --dark-card: #333333;
            --slider-bg: #ccc;
        }

        /* Animations Declaration */
        @keyframes slideIn {
            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }

        @keyframes popupFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes popupFadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }

            to {
                opacity: 0;
                transform: scale(0.95);
            }
        }

        /* CSS Start */
        body {
            margin: 0;
            font-family: "Manrope", sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--primary-bg);
            color: #333;
            padding: 10px;
            text-align: left;
            height: 40px;
            border-bottom-style: solid;
            border-color: var(--border);
            background-image: url('https://materioa.netlify.app/static/res/materio_black.svg');
            background-repeat: no-repeat;
            background-size: 120px 32px;
            background-position: 20px center;

        }

        .container {
            display: flex;
            flex: 1;
        }

        .navbar {
            background-color: var(--primary-bg);
            color: var(--navbar);
            width: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            position: sticky;
            border-right-style: solid;
            border-color: var(--border);
        }

        .navbar a {
            color: var(--navbar-grey);
            text-decoration: none;
            padding: 10px;
            width: 100%;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: larger;
            position: relative;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .navbar a i {
            margin-right: 10px;
        }

        .navbar a.active {
            color: var(--secondary);
            transform: translateX(5px);
        }

        .content {
            flex: 1;
            padding: 20px;
        }

        .card-one {
            border-radius: 15px;
            background-color: var(--card);
            padding: 20px;
            margin: 20px 0;
            min-height: 150px;
        }

        .card-layout {
            border-radius: 15px;
            background-color: var(--card);
            padding: 20px;
            margin: 20px 0;
            min-height: 30px;
        }

        .tab-content {
            display: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            position: relative;
        }

        .tab-content.active {
            opacity: 1;
            visibility: visible;
        }

        #popup {
            display: none;
            position: fixed;
            top: 2%;
            left: 2%;
            width: 95%;
            height: 95%;
            background-color: var(--primary-bg);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            overflow: auto;
            border-radius: 10px;
            animation: popupFadeIn 0.3s ease-in-out;
        }

        #popupContent {
            padding: 20px;
        }

        #closePopup {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #333;
            outline: none;
        }

        #popup.closing {
            animation: popupFadeOut 0.3s ease-in-out;
        }

        .tab-content.active {
            display: block;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--slider-bg);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: var(--primary-bg);
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--secondary);
        }

        input:checked+.slider:before {
            transform: translateX(16px);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Dark Mode */
        body.dark-mode {
            background-color: var(--dark-bg);
            color: var(--primary-bg);
        }

        header.dark-mode {
            background-color: var(--dark-header);
            color: var(--primary-bg);
            border-color: var(--dark-border);
            background-image: url('https://materioa.netlify.app/static/res/materio_white.png');
            background-repeat: no-repeat;
            background-size: 120px 32px;
            background-position: 20px center;
        }

        #popup.dark-mode {
            background-color: var(--dark-header);
            color: var(--primary-bg);
        }

        .navbar.dark-mode {
            background-color: var(--dark-header);
            border-color: var(--dark-border);
        }

        .navbar.dark-mode a {
            color: var(--dark-nav);
        }

        .card-layout.dark-mode {
            background-color: var(--dark-card);
            color: var(--primary-bg);
        }

        .card-one.dark-mode {
            background-color: var(--dark-card);
            color: var(--primary-bg);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .navbar {
                width: 100%;
                height: 60px;
                flex-direction: row;
                justify-content: space-around;
                padding-top: 0;
                position: fixed;
                bottom: 0;
                border-top-style: solid;
                border-color: var(--border);
            }

            .navbar a {
                width: auto;
                padding: 10px 20px;
            }

            .navbar a.active {
                color: var(--secondary);
                transform: translateY(-5px);
            }

            .content {
                margin-bottom: 60px;
            }
        }
    </style>
</head>
<body>
    <header>
    </header>
    <div class="container">
        <nav class="navbar">
            <a href="#" class="tab-link active" data-tab="home">
                <i class="fas fa-home"></i>
            </a>
            <a href="#" class="tab-link" data-tab="chat">
                <i class="fas fa-comments"></i>
            </a>
            <a href="#" class="tab-link" data-tab="notifications">
                <i class="fas fa-bell"></i>
            </a>
            <a href="#" class="tab-link" data-tab="settings">
                <i class="fas fa-cog"></i>
            </a>
        </nav>
        <div class="content">
            <div id="home" class="tab-content active">
                <button id="submitButton">Submit</button>
                <div id="popup">
                    <button id="closePopup"><i class="fas fa-times"></i></button>
                    <div id="popupContent">
                        <h2>Welcome to the Popup!</h2>
                        <p>This is a white popup that almost covers the entire browser screen.</p>
                        <p>You can add any content here.</p>
                    </div>
                </div>
            </div>
            <div id="chat" class="tab-content">
                <h2>Chat</h2>
                <p>This is the Chat page.</p>
            </div>
            <div id="notifications" class="tab-content">
                <h1>Notifications</h1>
                <div class="notification-board" style="color:#000000;" id="notificationBoard">
                    <!-- Notifications will be dynamically added here -->
                </div>
            </div>
            <div id="settings" class="tab-content">
                <h1>Settings</h1>
                <div class="card-one" id="versionInfo">
                </div>

                <div class="card-layout" id="themeCard">
                    <div class="toggle-container">
                        <span>Enable Dark Mode</span>
                        <label class="switch">
                            <input type="checkbox" id="themeToggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="card-one" id="details">
                    <h1> About</h1>
                </div>
            </div>

            <script>
                const submitButton = document.getElementById('submitButton');
                const popup = document.getElementById('popup');
                const closePopup = document.getElementById('closePopup');
                submitButton.addEventListener('click', () => {
                    popup.style.display = 'block';
                });
                closePopup.addEventListener('click', () => {
                    popup.style.display = 'none';
                });
                window.addEventListener('click', (event) => {
                    if (event.target === popup) {
                        popup.style.display = 'none';
                    }
                });

                document.addEventListener('DOMContentLoaded', function () {
                    const tabLinks = document.querySelectorAll('.tab-link');
                    const tabContents = document.querySelectorAll('.tab-content');
                    tabLinks.forEach(link => {
                        link.addEventListener('click', function (e) {
                            e.preventDefault();
                            tabLinks.forEach(tab => tab.classList.remove('active'));
                            tabContents.forEach(content => content.classList.remove('active'));
                            this.classList.add('active');
                            const tab = this.getAttribute('data-tab');
                            document.getElementById(tab).classList.add('active');
                        });
                    });
                });

                submitButton.addEventListener('click', () => {
                    popup.classList.remove('closing');
                    popup.style.display = 'block';
                });
                closePopup.addEventListener('click', () => {
                    popup.classList.add('closing');
                });
                popup.addEventListener('animationend', (event) => {
                    if (event.animationName === 'popupFadeOut') {
                        popup.style.display = 'none';
                        popup.classList.remove('closing');
                    }
                });

                themeToggle.addEventListener('change', function () {
                    const elements = [
                        document.body,
                        document.querySelector('header'),
                        document.querySelector('.navbar'),
                        document.querySelector('.content'),
                        document.getElementById('themeCard'),
                        document.getElementById('popup'),
                        document.getElementById('versionInfo'),
                        document.getElementById('details')
                    ];
                    elements.forEach(el => {
                        if (this.checked) {
                            el.classList.add('dark-mode');
                        } else {
                            el.classList.remove('dark-mode');
                        }
                    });
                });
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    themeToggle.checked = true;
                    const elements = [
                        document.body,
                        document.querySelector('header'),
                        document.querySelector('.navbar'),
                        document.querySelector('.content'),
                        document.getElementById('themeCard'),
                        document.getElementById('popup'),
                        document.getElementById('versionInfo')
                    ];
                    elements.forEach(el => el.classList.add('dark-mode'));
                }
            </script>
</body>
</html>
