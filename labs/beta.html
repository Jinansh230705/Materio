       /* From Uiverse.io by rishichawda */ 
/* The switch - the box around the slider */
#theme-toggle-button {
  font-size: 17px;
  position: static;
  display: inline-block;
  width: 3em;
  cursor: pointer;
}

/* Hide default HTML checkbox */
#toggle {
  opacity: 0;
  width: 0;
  height: 0;
}

#container,
#patches,
#stars,
#button,
#sun,
#moon,
#cloud {
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 0.25s;
}

/* night sky background */
#toggle:checked + svg #container {
  fill: #2b4360;
}

/* move button to right when checked */
#toggle:checked + svg #button {
  transform: translate(28px, 2.333px);
}

/* show/hide sun and moon based on checkbox state */
#sun {
  opacity: 1;
}

#toggle:checked + svg #sun {
  opacity: 0;
}

#moon {
  opacity: 0;
}

#toggle:checked + svg #moon {
  opacity: 1;
}

/* show or hide background items on checkbox state */
#cloud {
  opacity: 1;
}

#toggle:checked + svg #cloud {
  opacity: 0;
}

#stars {
  opacity: 0;
}

#toggle:checked + svg #stars {
  opacity: 1;
}

    <script>
        function toggleSettingsDialog() {
            var dialog = document.getElementById('settings-dialog');
            if (dialog.style.display === 'none') {
                dialog.style.display = 'block';
            } else {
                dialog.style.display = 'none';
            }
        }

        document.getElementById('notification-bell').onclick = function () {
            document.getElementById('notification-dialog').style.display = 'block';
        }

        document.getElementById('close-notification-dialog').onclick = function () {
            document.getElementById('notification-dialog').style.display = 'none';
        }

        window.onclick = function (event) {
            if (event.target == document.getElementById('notification-dialog')) {
                document.getElementById('notification-dialog').style.display = 'none';
            }
        }

        let subjects = {};

        // Fetch JSON data
        fetch('data.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                subjects = data;
                console.log("Fetched JSON Data:", subjects); // Debugging log
                populateSubjects(); // Initialize dropdowns
            })
            .catch(error => {
                console.error('Error loading subjects:', error);
            });

        function populateSubjects() {
            const semesterSelect = document.getElementById('semesterSelect');
            const subjectSelect = document.getElementById('subjectSelect');
            const semester = semesterSelect.value;
            if (subjects[semester]) {
                const subjectList = subjects[semester];
                subjectSelect.innerHTML = '<option value="">Select Subject</option>';
                for (let subject in subjectList) {
                    let option = document.createElement('option');
                    option.value = subject;
                    option.text = subject;
                    subjectSelect.appendChild(option);
                }
                populateTypes(); // Populate types after subjects
            }
        }

        function populateTypes() {
            const semesterSelect = document.getElementById('semesterSelect');
            const subjectSelect = document.getElementById('subjectSelect');
            const typeSelect = document.getElementById('typeSelect');
            const semester = semesterSelect.value;
            const subject = subjectSelect.value;
            typeSelect.innerHTML = '<option value="">Select Type</option>';

            if (subjects[semester] && subjects[semester][subject]) {
                const contentList = subjects[semester][subject];
                const types = new Set(contentList.map(item => item.type)); // Extract unique types
                for (let type of types) {
                    let option = document.createElement('option');
                    option.value = type;
                    option.text = type;
                    typeSelect.appendChild(option);
                }
                populateChapters(); // Populate chapters after types
            }
        }

        function populateChapters() {
            const semesterSelect = document.getElementById('semesterSelect');
            const subjectSelect = document.getElementById('subjectSelect');
            const typeSelect = document.getElementById('typeSelect');
            const chapterSelect = document.getElementById('chapterSelect');
            const semester = semesterSelect.value;
            const subject = subjectSelect.value;
            const type = typeSelect.value;
            chapterSelect.innerHTML = '<option value="">Select Chapter</option>';

            if (subjects[semester] && subjects[semester][subject]) {
                const contentList = subjects[semester][subject];

                    for (let item of filteredContent.content) {
                        let option = document.createElement('option');
                        option.value = item;
                        option.text = item;
                        chapterSelect.appendChild(option);
                    }
                }
            }
        }

function formatDateTime(dateString) {
    const date = new Date(dateString);
    return date.toLocaleString('en-US', { 
        dateStyle: 'medium', 
        timeStyle: 'short' 
    });
}
function displayNotifications() {
    const notificationBoard = document.getElementById('notificationBoard');
    notificationBoard.innerHTML = '';

    // Compute the threshold date (20 days ago)
    const twentyDaysAgo = new Date();
    twentyDaysAgo.setDate(twentyDaysAgo.getDate() - 20);

    // Filter out notifications older than 20 days
    const validNotifications = notifications.filter(notification => new Date(notification.date) >= twentyDaysAgo);

    // Sort valid notifications by date (newest first)
    validNotifications.sort((a, b) => new Date(b.date) - new Date(a.date));

    if (validNotifications.length === 0) {
        const noNotification = document.createElement('div');
        noNotification.classList.add('no-notifications');
        noNotification.textContent = "No New Notifications";
        notificationBoard.appendChild(noNotification);
        return;
    }

    validNotifications.forEach((notification) => {
        const container = document.createElement('div');
        container.classList.add('notification');

        const title = document.createElement('h3');
        title.textContent = notification.title;
        container.appendChild(title);

        const message = document.createElement('p');
        message.textContent = notification.message;
        container.appendChild(message);

        const date = document.createElement('span');
        date.classList.add('notification-date');
        date.textContent = formatDateTime(notification.date);
        container.appendChild(date);

        if (notification.links && notification.links.length > 0) {
            const linksContainer = document.createElement('div');
            linksContainer.classList.add('notification-links');
            notification.links.forEach(linkObj => {
                const link = document.createElement('a');
                link.href = linkObj.url;
                link.textContent = linkObj.text;
                linksContainer.appendChild(link);
            });
            container.appendChild(linksContainer);
        }
        notificationBoard.appendChild(container);
    });
}

document.addEventListener('DOMContentLoaded', (event) => {
    const toggle = document.getElementById('toggle');
    toggle.addEventListener('change', () => {
        if (toggle.checked) {
            document.body.classList.add('expresso');
            document.body.classList.remove('thermal');
        } else {
            document.body.classList.add('thermal');
            document.body.classList.remove('expresso');
        }
    });

    // Set initial theme based on user preference or default to light theme
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        toggle.checked = true;
        document.body.classList.add('expresso');
    } else {
        document.body.classList.add('thermal');
    }
});
