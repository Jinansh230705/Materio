<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Materio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/redesigned-styles.css">
  <script>
    // Auto-detect and apply dark mode based on cookie
    document.addEventListener('DOMContentLoaded', function () {
      const darkModeCookie = document.cookie.split('; ').find(row => row.startsWith('darkMode='));
      if (darkModeCookie && darkModeCookie.split('=')[1] === 'true') {
        document.body.classList.add('dark-mode');

        // Switch logos for dark mode
        const lightLogo = document.getElementById('logo-light');
        const darkLogo = document.getElementById('logo-dark');
        if (lightLogo && darkLogo) {
          lightLogo.style.display = 'none';
          darkLogo.style.display = 'inline-block';
        }
      }
    });
  </script>
</head>

<body>
  <div class="container">
    <div class="card-one">
      <div class="auth-header">
        <img src="images/materio_new_bk.svg" alt="Materio Logo" class="logo" id="logo-light">
        <img src="images/materio_new_wh.svg" alt="Materio Logo" class="logo" id="logo-dark" style="display: none;">
        <h2>Forgot Password?</h2>
        <p>Enter your email and recovery key to reset your password</p>
      </div>

      <div class="auth-form">
        <form id="forgotPasswordForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="recoveryKey">Recovery Key</label>
            <input type="text" id="recoveryKey" name="recoveryKey" placeholder="Enter your recovery key" required>
          </div>

          <div id="passwordReset" class="form-group hidden">
            <label for="newPassword">New Password</label>
            <div class="password-input">
              <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password">
              <i class="fas fa-eye toggle-password" data-target="newPassword"></i>
            </div>
          </div>

          <div id="confirmPasswordReset" class="form-group hidden">
            <label for="confirmNewPassword">Confirm New Password</label>
            <div class="password-input">
              <input type="password" id="confirmNewPassword" name="confirmNewPassword"
                placeholder="Confirm new password">
              <i class="fas fa-eye toggle-password" data-target="confirmNewPassword"></i>
            </div>
          </div>

          <button type="submit" class="btn">VERIFY & RESET</button>

          <div class="form-footer">
            <p><a href="index.html">Back to login</a></p>
          </div>
        </form>
      </div>
    </div>

    <div class="card-layout">
      <div style="text-align: center;">
        <p><i class="fas fa-arrow-left"></i> <a href="https://materioa.netlify.app/">Back to Materio</a></p>
      </div>
    </div>
  </div>

  <!-- Notification component -->
  <div id="notification" class="notification">
    <div class="notification-content">
      <i class="notification-icon"></i>
      <div class="notification-message"></div>
    </div>
    <button class="notification-close">&times;</button>
  </div>

  <script>
    // Toggle logo based on dark mode
    function toggleLogo() {
      const lightLogo = document.getElementById('logo-light');
      const darkLogo = document.getElementById('logo-dark');
      if (document.body.classList.contains('dark-mode')) {
        lightLogo.style.display = 'none';
        darkLogo.style.display = 'inline-block';
      } else {
        lightLogo.style.display = 'inline-block';
        darkLogo.style.display = 'none';
      }
    }

    // Check for dark mode when page loads
    document.addEventListener('DOMContentLoaded', function () {
      toggleLogo();
    });
  </script>
  <script src="js/auth.js"></script>
  <script src="js/forgot-password.js"></script>
  <script src="js/ux-enhancers.js"></script>
</body>

</html>
