<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Files - Materio Auth</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/redesigned-styles.css">
  <style>
    .files-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .upload-area {
      border: 2px dashed #ddd;
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      background-color: rgba(255, 245, 223, 0.3);
      margin-bottom: 30px;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    
    .upload-area:hover {
      border-color: #ff8200;
      background-color: rgba(255, 130, 0, 0.1);
    }
    
    .upload-area.dragover {
      border-color: #ff8200;
      background-color: rgba(255, 130, 0, 0.2);
    }
    
    .upload-icon {
      font-size: 48px;
      color: #ff8200;
      margin-bottom: 15px;
    }
    
    .files-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .file-card {
      background-color: rgba(255, 245, 223, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
      cursor: pointer;
    }
    
    .file-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }
    
    .file-icon {
      font-size: 32px;
      text-align: center;
      margin-bottom: 10px;
      color: #ff8200;
    }
    
    .file-name {
      font-weight: 600;
      margin-bottom: 5px;
      word-break: break-word;
    }
    
    .file-size {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }
    
    .file-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    
    .file-action-btn {
      background: none;
      border: none;
      padding: 5px;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.2s ease;
    }
    
    .file-action-btn:hover {
      background-color: rgba(255, 130, 0, 0.1);
    }
    
    .loading-spinner {
      text-align: center;
      padding: 40px;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #ff8200;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .back-button {
      background-color: rgba(255, 245, 223, 0.8);
      backdrop-filter: blur(10px);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      color: #333;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: "Manrope", sans-serif;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .back-button:hover {
      background-color: rgba(255, 130, 0, 0.1);
      transform: translateY(-1px);
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
    
    .empty-state i {
      font-size: 64px;
      color: #ddd;
      margin-bottom: 20px;
    }
    
    /* Dark mode styles */
    body.dark-mode .upload-area {
      background-color: rgba(51, 51, 51, 0.3);
      border-color: #555;
    }
    
    body.dark-mode .upload-area:hover {
      border-color: #ff8200;
      background-color: rgba(255, 130, 0, 0.1);
    }
    
    body.dark-mode .file-card {
      background-color: rgba(51, 51, 51, 0.8);
      color: #fff;
    }
    
    body.dark-mode .file-size {
      color: #ccc;
    }
    
    body.dark-mode .back-button {
      background-color: rgba(51, 51, 51, 0.8);
      color: #fff;
    }
  </style>
  <script>
    // Check for dark mode cookie
    document.addEventListener('DOMContentLoaded', function () {
      const darkModeCookie = document.cookie.split('; ').find(row => row.startsWith('darkMode='));
      if (darkModeCookie && darkModeCookie.split('=')[1] === 'true') {
        document.body.classList.add('dark-mode');
      }
    });
  </script>
</head>

<body>
  <div class="profile-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <button class="sidebar-close-btn" aria-label="Close menu">
        <i class="fas fa-times"></i>
      </button>
      <div class="sidebar-header">
        <img src="images/materio_new_bk.svg" alt="Materio Logo" class="logo" id="logo-light">
        <img src="images/materio_new_wh.svg" alt="Materio Logo" class="logo" id="logo-dark" style="display: none;">
      </div>

      <div class="sidebar-nav">
        <button class="sidebar-nav-item" data-tab="dashboard">
          <i class="fas fa-tachometer-alt"></i> Dashboard
        </button>
        <button class="sidebar-nav-item" data-tab="security">
          <i class="fas fa-shield-alt"></i> Security
        </button>
        <button class="sidebar-nav-item" data-tab="danger">
          <i class="fas fa-exclamation-triangle"></i> Danger Zone
        </button>
      </div>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
          <i class="fas fa-moon" id="theme-icon"></i>
        </button>
        <button class="logout-btn" id="logout-btn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <button class="mobile-menu-btn" aria-label="Open menu">
        <i class="fas fa-bars"></i>
      </button>

      <div class="content-wrapper">
        <div class="files-header">
          <div>
            <a href="profile.html" class="back-button">
              <i class="fas fa-arrow-left"></i>
              Back to Dashboard
            </a>
          </div>
          <h1>My Files</h1>
          <button id="refreshFilesBtn" class="btn btn-outline">
            <i class="fas fa-sync-alt"></i> Refresh
          </button>
        </div>

        <!-- Upload Area -->
        <div class="card-layout">
          <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">
              <i class="fas fa-cloud-upload-alt"></i>
            </div>
            <h3>Upload Files</h3>
            <p>Click here or drag and drop files to upload to your Google Drive</p>
            <input type="file" id="fileInput" multiple style="display: none;">
          </div>
        </div>

        <!-- Files List -->
        <div class="card-layout">
          <h3>Your Files</h3>
          <div id="filesContainer">
            <div class="loading-spinner" id="loadingSpinner">
              <div class="spinner"></div>
              <p>Loading your files...</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- File Preview Modal -->
  <div id="filePreviewModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="previewFileName">File Preview</h3>
        <button class="modal-close" onclick="closeFilePreview()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <div id="previewContent">
          <!-- File preview will be loaded here -->
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeFilePreview()">Close</button>
        <button class="btn btn-primary" id="downloadFileBtn">
          <i class="fas fa-download"></i> Download
        </button>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
  <!-- <script src="js/google-drive.js"></script> -->
  <script>
    // Files page specific functionality
    class FilesManager extends GoogleDriveManager {
      constructor() {
        super();
        this.initFilesPage();
      }

      initFilesPage() {
        this.setupDragAndDrop();
        this.loadFiles();
        
        // Hide the link/unlink buttons since this is the files page
        const linkBtn = document.getElementById('linkDriveBtn');
        const unlinkBtn = document.getElementById('unlinkDriveBtn');
        if (linkBtn) linkBtn.style.display = 'none';
        if (unlinkBtn) unlinkBtn.style.display = 'none';
      }

      setupDragAndDrop() {
        const uploadArea = document.getElementById('uploadArea');
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
          uploadArea.addEventListener(eventName, this.preventDefaults, false);
        });

        ['dragenter', 'dragover'].forEach(eventName => {
          uploadArea.addEventListener(eventName, () => uploadArea.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
          uploadArea.addEventListener(eventName, () => uploadArea.classList.remove('dragover'), false);
        });

        uploadArea.addEventListener('drop', (e) => this.handleDrop(e), false);
      }

      preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
      }

      handleDrop(e) {
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          this.uploadFiles(files);
        }
      }

      handleFileUpload(e) {
        const files = e.target.files;
        if (files.length > 0) {
          this.uploadFiles(files);
        }
      }

      async uploadFiles(files) {
        const uploadArea = document.getElementById('uploadArea');
        uploadArea.innerHTML = `
          <div class="upload-icon">
            <i class="fas fa-spinner fa-spin"></i>
          </div>
          <h3>Uploading...</h3>
          <p>Please wait while your files are being uploaded</p>
        `;

        try {
          for (let file of files) {
            await this.uploadFile(file);
          }
          this.showSuccess('Files uploaded successfully!');
          this.loadFiles();
        } catch (error) {
          this.showError('Upload failed: ' + error.message);
        } finally {
          // Reset upload area
          uploadArea.innerHTML = `
            <div class="upload-icon">
              <i class="fas fa-cloud-upload-alt"></i>
            </div>
            <h3>Upload Files</h3>
            <p>Click here or drag and drop files to upload to your Google Drive</p>
            <input type="file" id="fileInput" multiple style="display: none;">          `;
          uploadArea.onclick = () => document.getElementById('fileInput').click();
          
          // Re-add event listener for file input
          const fileInput = document.getElementById('fileInput');
          if (fileInput) {
            fileInput.addEventListener('change', (e) => this.handleFileUpload(e));
          }
        }
      }

      renderFiles(files) {
        const container = document.getElementById('filesContainer');
        
        if (files.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-folder-open"></i>
              <h3>No files found</h3>
              <p>Upload some files to get started!</p>
            </div>
          `;
          return;
        }

        const filesGrid = files.map(file => `
          <div class="file-card" onclick="previewFile('${file.id}', '${file.name}', '${file.mimeType}')">
            <div class="file-icon">
              ${this.getFileIcon(file.mimeType)}
            </div>
            <div class="file-name">${file.name}</div>
            <div class="file-size">${this.formatFileSize(file.size)}</div>
            <div class="file-actions">
              <button class="file-action-btn" onclick="event.stopPropagation(); previewFile('${file.id}', '${file.name}', '${file.mimeType}')" title="Preview">
                <i class="fas fa-eye"></i>
              </button>
              <button class="file-action-btn" onclick="event.stopPropagation(); downloadFile('${file.id}', '${file.name}')" title="Download">
                <i class="fas fa-download"></i>
              </button>
              <button class="file-action-btn" onclick="event.stopPropagation(); deleteFile('${file.id}', '${file.name}')" title="Delete">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        `).join('');

        container.innerHTML = `<div class="files-grid">${filesGrid}</div>`;
      }

      getFileIcon(mimeType) {
        if (mimeType.startsWith('image/')) return '<i class="fas fa-image"></i>';
        if (mimeType.startsWith('video/')) return '<i class="fas fa-video"></i>';
        if (mimeType.startsWith('audio/')) return '<i class="fas fa-music"></i>';
        if (mimeType.includes('pdf')) return '<i class="fas fa-file-pdf"></i>';
        if (mimeType.includes('word') || mimeType.includes('document')) return '<i class="fas fa-file-word"></i>';
        if (mimeType.includes('sheet') || mimeType.includes('excel')) return '<i class="fas fa-file-excel"></i>';
        if (mimeType.includes('presentation') || mimeType.includes('powerpoint')) return '<i class="fas fa-file-powerpoint"></i>';
        if (mimeType.includes('zip') || mimeType.includes('rar')) return '<i class="fas fa-file-archive"></i>';
        return '<i class="fas fa-file"></i>';
      }

      formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
      }
    }    // Global functions for file operations
    function previewFile(fileId, fileName, mimeType) {
      // Implementation for file preview
      console.log('Preview file:', fileName);
      // For now, just open the file in a new tab
      if (window.filesManager) {
        // You could implement a preview modal here
        window.open(`https://drive.google.com/file/d/${fileId}/view`, '_blank');
      }
    }

    function downloadFile(fileId, fileName) {
      if (window.filesManager) {
        window.filesManager.downloadFile(fileId, fileName);
      }
    }

    function deleteFile(fileId, fileName) {
      if (confirm(`Are you sure you want to delete "${fileName}"?`)) {
        if (window.filesManager) {
          window.filesManager.deleteFile(fileId, fileName);
        }
      }
    }

    function closeFilePreview() {
      document.getElementById('filePreviewModal').style.display = 'none';
    }    // Initialize files manager when page loads
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize development mode if needed
      if (typeof initializeDevelopmentMode === 'function') {
        initializeDevelopmentMode();
      }
      
      window.filesManager = new FilesManager();
      
      // Add event listeners
      const fileInput = document.getElementById('fileInput');
      const refreshBtn = document.getElementById('refreshFilesBtn');
      
      if (fileInput) {
        fileInput.addEventListener('change', (e) => {
          window.filesManager.handleFileUpload(e);
        });
      }
      
      if (refreshBtn) {
        refreshBtn.addEventListener('click', () => {
          window.filesManager.loadFiles();
        });
      }
    });
  </script>
</body>

</html>
