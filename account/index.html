<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Materio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/redesigned-styles.css">
  <script>
    // Check for dark mode cookie
    document.addEventListener('DOMContentLoaded', function () {
      const darkModeCookie = document.cookie.split('; ').find(row => row.startsWith('darkMode='));
      if (darkModeCookie && darkModeCookie.split('=')[1] === 'true') {
        document.body.classList.add('dark-mode');
      }
    });
  </script>
</head>

<body>
  <div class="container">
    <div class="card-one">
      <div class="auth-form">
        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username or Email</label>
            <input type="text" id="username" name="username" placeholder="Enter your username or email" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input">
              <input type="password" id="password" name="password" placeholder="Enter your password" required>
              <i class="fas fa-eye toggle-password" data-target="password"></i>
            </div>
          </div>

          <div class="form-actions">
            <div class="remember-me">
              <input type="checkbox" id="remember" name="remember">
              <label for="remember">Remember Me</label>
            </div>
            <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
          </div>

          <button type="submit" class="btn">SIGN IN</button>

          <div class="form-footer">
            <p>Have an Invite ? <a href="/account/signup">Create an account</a> to try out newest features first!</p>
          </div>
        </form>
      </div>
    </div>

    <div class="card-layout">
      <div style="text-align: center;">
        <p><i class="fas fa-arrow-left"></i> <a href="/#">Back to Materio</a></p>
      </div>
    </div>
  </div>

  <!-- Notification component -->
  <div id="notification" class="notification">
    <div class="notification-content">
      <i class="notification-icon"></i>
      <div class="notification-message"></div>
    </div>
    <button class="notification-close">&times;</button>
  </div>

  <script>
    // Check for dark mode when page loads
    function checkAndApplyDarkMode() {
      // Check for dark mode preference in localStorage
      const darkModePreference = localStorage.getItem('darkMode');

      // Check for theme cookie as fallback
      const themeCookie = document.cookie.split('; ').find(row => row.startsWith('theme='));
      const cookieValue = themeCookie ? themeCookie.split('=')[1] : null;
      const cookieIsDark = cookieValue === 'dark';

      // Check system preference
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      // Determine if dark mode should be enabled
      let shouldUseDarkMode = false;

      if (darkModePreference !== null) {
        // Use stored preference
        shouldUseDarkMode = darkModePreference === 'true';
      } else if (cookieValue) {
        // Use cookie value
        shouldUseDarkMode = cookieIsDark;
      } else {
        // Use system preference
        shouldUseDarkMode = systemPrefersDark;
      }

      // Apply dark mode class
      if (shouldUseDarkMode) {
        document.body.classList.add('dark-mode');
      } else {
        document.body.classList.remove('dark-mode');
      }
    }

    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
      // Only auto-switch if no manual preference is set
      if (localStorage.getItem('darkMode') === null) {
        if (e.matches) {
          document.body.classList.add('dark-mode');
        } else {
          document.body.classList.remove('dark-mode');
        }
      }
    });

    // Run on page load
    checkAndApplyDarkMode();
  </script>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
  <script src="js/ux-enhancers.js"></script>
</body>

</html>
