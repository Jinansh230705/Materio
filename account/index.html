<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materio Account</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/redesigned-styles.css">
  <script>
    // Check for dark mode cookie
    document.addEventListener('DOMContentLoaded', function() {
      const darkModeCookie = document.cookie.split('; ').find(row => row.startsWith('darkMode='));
      if (darkModeCookie && darkModeCookie.split('=')[1] === 'true') {
        document.body.classList.add('dark-mode');
      }
    });
  </script>
</head>
<body>
  <div class="container">
    <div class="card-one">
      <div class="auth-form">
        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username or Email</label>
            <input type="text" id="username" name="username" placeholder="Enter your username or email" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input">
              <input type="password" id="password" name="password" placeholder="Enter your password" required>
              <i class="fas fa-eye toggle-password" data-target="password"></i>
            </div>
          </div>

          <div class="form-actions">
            <div class="remember-me">
              <input type="checkbox" id="remember" name="remember">
              <label for="remember">Remember Me</label>
            </div>
            <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
          </div>

          <button type="submit" class="btn">SIGN IN</button>
          
          <div class="form-footer">
            <p>Don't have an account? <a href="signup.html">Create an account</a></p>
          </div>
        </form>
      </div>
    </div>

    <div class="card-layout">
      <div style="text-align: center;">
        <p><i class="fas fa-arrow-left"></i> <a href="https://materioa.netlify.app/">Back to Materio</a></p>
      </div>
    </div>
  </div>

  <!-- Notification component -->
  <div id="notification" class="notification">
    <div class="notification-content">
      <i class="notification-icon"></i>
      <div class="notification-message"></div>
    </div>
    <button class="notification-close">&times;</button>
  </div>

  <script>
    // Toggle logo based on dark mode
    function toggleLogo() {
      const lightLogo = document.getElementById('logo-light');
      const darkLogo = document.getElementById('logo-dark');
      if (document.body.classList.contains('dark-mode')) {
        lightLogo.style.display = 'none';
        darkLogo.style.display = 'inline-block';
      } else {
        lightLogo.style.display = 'inline-block';
        darkLogo.style.display = 'none';
      }
    }
    
    // Check for dark mode when page loads
    document.addEventListener('DOMContentLoaded', function() {
      toggleLogo();
    });
  </script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
