<script>
    function hasAdFreePrivileges() {
        try {  
            const userDataStr = localStorage.getItem('materio_user');
            if (!userDataStr) {
                return false;
            }
            const userData = JSON.parse(userDataStr);
            return userData.isPlusUser === true || userData.hasAdminPrivileges === true;
        } catch (error) {
            console.log('Error checking user privileges for ads:', error);
            return false;
        }
    }
    if (!hasAdFreePrivileges()) {
        const adsenseScript = document.createElement('script');
        adsenseScript.async = true;
        adsenseScript.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7539227284131407';

        document.head.appendChild(adsenseScript);
    } else {
        console.log('Enjoy un-interrupted reading.');
    }
</script>
