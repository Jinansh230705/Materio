<!-- Service Worker Registration -->
{% comment %} Service worker control: respects `_config.yml:disable_service_worker` {% endcomment %}
{% if site.disable_service_worker %}
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            // Unregister any existing service workers and clear caches.
            navigator.serviceWorker.getRegistrations()
                .then(function (registrations) {
                    registrations.forEach(function (reg) {
                        try { reg.unregister(); } catch (e) { console.log('SW unregister error', e); }
                    });
                })
                .catch(function (err) { console.log('Error getting SW registrations:', err); });

            if (window.caches && caches.keys) {
                caches.keys()
                    .then(function (names) {
                        return Promise.all(names.map(function (name) { return caches.delete(name); }));
                    })
                    .then(function () { console.log('Client caches cleared'); })
                    .catch(function (e) { console.log('Cache clear failed', e); });
            }
        });
    }
</script>
<!-- Service Worker registration is disabled. See docs/SERVICE_WORKER_DISABLE.md to re-enable. -->
{% else %}
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js')
                .then(function (registration) {
                    // console.log('SW registered: ', registration);
                })
                .catch(function (registrationError) {
                    console.log('SW registration failed: ', registrationError);
                });
        });
    }
</script>
{% endif %}

<!-- PDF.js Viewer Preloading - Only on pages that use the PDF viewer -->
<script>
    (function () {
        // Only preload PDF.js assets if the page contains a PDF viewer or download links
        if (document.querySelector('[data-pdf-src], .pdf-viewer, .download-card, a[href$=".pdf"]') ||
            window.location.pathname.includes('/docs/')) {
            var preloads = [
                { href: '/oread/build/pdf.mjs', as: 'script', rel: 'modulepreload' },
                { href: '/oread/web/viewer.mjs', as: 'script', rel: 'modulepreload' },
                { href: '/oread/web/viewer.css', as: 'style', rel: 'preload' }
            ];
            preloads.forEach(function (p) {
                var link = document.createElement('link');
                link.rel = p.rel;
                link.href = p.href;
                if (p.as && p.rel === 'preload') link.setAttribute('as', p.as);
                if (p.rel === 'modulepreload' || p.rel === 'preload') link.crossOrigin = 'anonymous';
                document.head.appendChild(link);
            });
        }
    })();
</script>
