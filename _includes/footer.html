<footer class="site-footer">
  <div class="footer-content">
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }} All rights reserved.</p>
  </div>

  <div class="theme-switcher" style="margin-top: 1rem; margin-left: 0; background: var(--bg-color); border-radius: 9999px; display: flex; gap: 0.5rem; padding: 0.5rem 1rem; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); align-items: center; width: fit-content;">
    <button aria-label="Light Mode" onclick="setTheme('light')" id="light-btn" style="background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--text-color);">
      <i class="fa-regular fa-sun-bright"></i>
    </button>
    <button aria-label="Dark Mode" onclick="setTheme('dark')" id="dark-btn" style="background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--text-color);">
      <i class="fa-regular fa-moon"></i>
    </button>
    <button aria-label="System Theme" onclick="setTheme('system')" id="system-btn" style="background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--text-color);">
      <i class="fa-regular fa-desktop"></i>
    </button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const root = document.documentElement;
      const themeButtons = document.querySelectorAll('.theme-btn');
    
      function applyTheme(theme) {
        localStorage.setItem('theme', theme);
        if (theme === 'light') {
          root.classList.remove('dark');
        } else if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.classList.toggle('dark', prefersDark);
        }
      }
    
      themeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          applyTheme(btn.dataset.theme);
        });
      });
    
      const savedTheme = localStorage.getItem('theme') || 'system';
      applyTheme(savedTheme);
    });
    </script>
    
</footer>
