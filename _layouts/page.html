<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    {%- seo -%}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.css"
        media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-dark.css"
        media="(prefers-color-scheme: dark)">
    <!-- Prism JS -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js" defer></script>
    <!-- Optional: load language components -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-java.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-css.min.js" defer></script>
    <link rel="stylesheet" href="/assets/style/page.css">
    {%- feed_meta -%}
    {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
    {%- endif -%}    <script>
        document.addEventListener('DOMContentLoaded', () => {
            function getCookie(name) {
                const nameEQ = name + "=";
                const ca = document.cookie.split(";");
                for (let i = 0; i < ca.length; i++) {
                    let c = ca[i].trim();
                    if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length);
                }
                return null;
            }
            
            function setCookie(name, value, days) {
                let expires = "";
                if (days) {
                    const date = new Date();
                    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                    expires = "; expires=" + date.toUTCString();
                }
                document.cookie = name + "=" + value + expires + "; path=/";
            }
            
            function applyTheme(isDark) {
                const elements = [
                    document.body,
                    document.querySelector('header'),
                    document.querySelector('.site-header')
                ];
                
                elements.forEach(el => {
                    if (el) {
                        if (isDark) {
                            el.classList.add('dark-mode');
                        } else {
                            el.classList.remove('dark-mode');
                        }
                    }
                });
            }
            
            // Initialize theme
            const userTheme = getCookie("theme");
            const isDark = userTheme === "dark" || (!userTheme && window.matchMedia("(prefers-color-scheme: dark)").matches);
            
            applyTheme(isDark);
            
            // Set up theme toggle
            const themeToggle = document.getElementById('pageThemeToggle');
            if (themeToggle) {
                themeToggle.checked = isDark;
                themeToggle.addEventListener("change", function () {
                    const newIsDark = this.checked;
                    setCookie("theme", newIsDark ? "dark" : "light", 30);
                    applyTheme(newIsDark);
                });
            }
            
            const logo = document.querySelector('.header-logo');
            if (logo) {
                logo.addEventListener('click', () => {
                    window.location.href = '/';
                });
            }
        });
    </script>
</head>

<body>
    <header class="site-header">
        <div class="header-logo" role="link" tabindex="0" aria-label="Go to homepage"></div>
    
    </header>
    <main class="page-content">
        <h1 class="page-title">{{ page.title }}</h1>
        <article class="markdown-body">
            {{ content }}
        </article>
    </main>
</body>

</html>
