  <style>
    /* Default link color for light mode */
    body {
      --link: #000000;
    }

    body.dark {
      --bg: #121212;
      --text: #eeeeee;
      --link: #3ea6ff;
      --card-bg: #1e1e1e;
      --border: #333;
    }

    .dark .site-header {
      background-color: rgba(33, 33, 33, 0.5);
      background-image: url('/assets/img/materio_new_wh.svg');
    }

    body.blog-layout .site-header {
      background-image: url('/assets/img/banner.svg');
      width: 575px;
    }

    body.blog-layout.dark .site-header {
      background-image: url('/assets/img/banner.svg');
    }

    /* Mobile: ensure header is full width and properly sized */
    @media (max-width: 768px) {

      body.blog-layout .site-header,
      body.blog-layout.dark .site-header {
        width: 100% !important;
        max-width: 100% !important;
      }
    }

    /* Use Libre Baskerville for emphasized/italic text in posts */
    article em,
    article i,
    .post-content em,
    .post-content i,
    .changelog-excerpt em,
    .changelog-excerpt i {
      font-family: 'Libre Baskerville', serif;
      font-style: italic;
      font-weight: 400;
    }

    /* Link pill styling for in-post links */
    .post-body a.link-pill,
    .post-content a.link-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.04);
      color: var(--link, #0b66c3);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      line-height: 1;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .post-body a.link-pill i.fa-regular,
    .post-content a.link-pill i.fa-regular {
      opacity: 0.9;
      font-size: 0.9rem;
      margin-left: 0.1rem;
    }

    /* Label inside the pill; truncates with ellipsis when long */
    .post-body a.link-pill .pill-label,
    .post-content a.link-pill .pill-label {
      display: inline-block;
      max-width: 18ch;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    body.dark .post-body a.link-pill,
    body.dark .post-content a.link-pill {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.04);
      color: var(--text);
    }

    /* (previously used ::after for domain) */
    /* Skip pill styling for images inside anchors */
    .post-body a.link-pill img,
    .post-content a.link-pill img {
      display: inline-block;
      max-height: 1.2rem;
    }

    /* Ensure the icon sits at the very end of the pill */
    .post-body a.link-pill i.fa-regular,
    .post-content a.link-pill i.fa-regular {
      order: 2;
    }

    .post-body a.link-pill .pill-label,
    .post-content a.link-pill .pill-label {
      order: 1;
    }

    @media (max-width: 640px) {

      .post-body a.link-pill::after,
      .post-content a.link-pill::after {
        display: none;
      }

      .post-body a.link-pill,
      .post-content a.link-pill {
        font-size: 0.92rem;
      }
    }
  </style>

<body{% if page.url=='/' or layout.name=='post' %} class="blog-layout" {% endif %}>
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
  <script>
    (function () {
      // Enhance links inside post content to look like pills.
      function enhancePostLinks(rootSelector) {
        var roots = document.querySelectorAll(rootSelector);
        if (!roots.length) return;
        roots.forEach(function (root) {
          var anchors = root.querySelectorAll('a[href]:not(.no-pill)');
          anchors.forEach(function (a) {
            // Skip anchors that wrap block elements or images (image links)
            if (a.querySelector('img')) return;
            // Skip anchors inside code or pre
            if (a.closest('code, pre')) return;
            // Add pill class if not already present
            if (!a.classList.contains('link-pill')) a.classList.add('link-pill');
            // Ensure FontAwesome arrow exists
            if (!a.querySelector('i.fa-arrow-up-right')) {
              var i = document.createElement('i');
              i.className = 'fa-regular fa-arrow-up-right';
              a.appendChild(i);
            }
            // Add data-domain (short host or path) for ::after display
            try {
              var href = a.getAttribute('href');
              var url = new URL(href, window.location.href);
              var domain = url.host + (url.pathname && url.pathname !== '/' ? url.pathname.replace(/\/$/, '') : '');
              // If relative link on same host, show path only
              if (url.origin === window.location.origin) domain = url.pathname.replace(/\/$/, '') || url.pathname || url.href;
              a.setAttribute('data-domain', domain);
              // For external links, open in new tab and add rel
              if (url.origin && url.origin !== window.location.origin) {
                a.setAttribute('target', '_blank');
                a.setAttribute('rel', 'noopener noreferrer');
              }
            } catch (e) {
              // ignore parse errors
            }
          });
        });
      }
      // Run on DOMContentLoaded
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () {
          enhancePostLinks('.post-body');
          enhancePostLinks('.post-content');
        });
      } else {
        enhancePostLinks('.post-body');
        enhancePostLinks('.post-content');
      }
    })();
  </script>
  <script src="{{ '/assets/scripts/post-base.js' | relative_url }}"></script>
  </body>
