<!DOCTYPE html>
<html lang="en">

<head> {% include head.html %}
    <link rel="stylesheet" href="{{ '/assets/style/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/style/notification.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/style/gestures.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/style/ota-update.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/style/notebook.css' | relative_url }}">

    <!-- KaTeX for LaTeX rendering in notebooks -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <!-- Highlight.js for code syntax highlighting in notebooks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

    <script>
        (function () {
            function getCookie(name) {
                var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
                return match ? match[2] : null;
            }
            var theme = getCookie('theme');
            var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (theme === 'dark' || (!theme && systemDark)) {
                document.documentElement.classList.add('dark-mode');
                document.body && document.body.classList.add('dark-mode');
            }
        })();
    </script>
</head>

<body>
    <!-- {% unless site.enable_experimental_filters %}
    {% include liquid-glass.html %}
    {% endunless %} -->

    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M6PC6RJL" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <header class="actual-content">
        <a href="/" class="header-logo" role="button" aria-label="Go to homepage"></a>
        <div class="header-actions">
            <button class="bug-report-btn" id="bugReportBtn" aria-label="Report a Bug" title="Report a Bug"
                onclick="openDynamicForm('bug-report')">
                <i class="fa-regular fa-comment-exclamation"></i>
            </button>
            <div id="bugReportTooltip" class="bug-report-tooltip">
                <span>Found a bug? Report it here.</span>
                <i class="fa-solid fa-xmark close-tooltip" onclick="closeBugTooltip()"></i>
            </div>
            <a href="https://statuspage.incident.io/materio" target="_blank" class="health-status-container"
                aria-label="System Status">
                <div class="health-status-indicator" id="healthIndicator"></div>
                <span class="health-status-text" id="healthStatusText">Operational</span>
            </a>
        </div>
    </header>
    <main>
        {% include main.html %}
    </main>

    <script type="module" src="{{ '/assets/scripts/bundle.js' | relative_url }}"></script>

    <!-- Classic scripts - loaded in dependency order -->
    <script src="{{ '/assets/scripts/keyboard-shortcuts.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/scripts/forms.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/scripts/pdf-downloads.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/scripts/caching.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/scripts/downloads-ui.js' | relative_url }}" defer></script>

    <script src="{{ '/assets/scripts/main.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/scripts/exam-card.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/scripts/notebooks-tab.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/scripts/community/community.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/scripts/advanced.js' | relative_url }}" defer></script>

    <!-- Webapp - essential for PWA -->
    {% unless site.disable_service_worker %}
    <script src="{{ '/assets/scripts/webapp/pwa.js' | relative_url }}" defer></script>
    {% endunless %}

</body>

</html>
